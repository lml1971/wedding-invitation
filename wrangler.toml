# ==================================================
# Cloudflare Worker 部署配置
# ==================================================
# 【可配置】name: Worker名称，部署后访问地址为 https://<name>.<account>.workers.dev
# 【可配置】ADMIN_PASSWORD: 管理后台登录密码（建议修改！）
# KV namespace 会在首次部署时由 deploy.js 自动创建
# ==================================================

name = "wedding-invitation"
main = "src/worker.js"
compatibility_date = "2024-09-25"
compatibility_flags = ["nodejs_compat"]

# ================== 可配置环境变量 ==================
[vars]
# 管理后台密码（部署后建议在 Cloudflare 仪表盘修改为加密变量）
ADMIN_PASSWORD = "lml1971"

# ================== KV Namespace ==================
# KV namespace ID（已创建，Cloudflare Pages/Workers 部署时直接使用）
# 如需重建：npx wrangler kv namespace create WEDDING_KV
[[kv_namespaces]]
binding = "WEDDING_KV"
id = "583c37d2a4ca473fb67309d76e8a7689"

